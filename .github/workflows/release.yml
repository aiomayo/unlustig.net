name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build artifacts only, do not publish to Modrinth/CurseForge'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Determine version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Read pack metadata
        id: meta
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("pack.toml", "rb") as f:
              pack = tomllib.load(f)
          versions = pack["versions"]
          mc = versions["minecraft"]
          loader = next(k for k in versions if k != "minecraft")
          print(f"game_versions={mc}")
          print(f"loader={loader}")
          PY

      - name: Build resource packs
        run: python3 .github/scripts/build-resourcepacks.py

      - name: Export
        env:
          BASE: unlustig.net-${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          packwiz refresh --build
          packwiz modrinth export -o "dist/${BASE}.mrpack"
          packwiz curseforge export -s client -o "dist/${BASE}-curseforge.zip" \
            || echo "::warning::CurseForge export failed"
          ls -la dist

      - name: Generate mod list
        run: |
          {
            echo "## Mods"
            echo
            packwiz list -v | sed 's/^/- /'
          } > dist/modlist.md
          cat dist/modlist.md

      - uses: actions/upload-artifact@v4
        with:
          name: pack
          path: dist/*
          if-no-files-found: error

      - name: Publish to Modrinth and CurseForge
        if: github.ref_type == 'tag' && inputs.dry-run != true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            dist/*.mrpack
            dist/*.zip
          name: unlustig.net ${{ steps.ver.outputs.version }}
          version: ${{ steps.ver.outputs.version }}
          version-type: release
          game-versions: ${{ steps.meta.outputs.game_versions }}
          loaders: ${{ steps.meta.outputs.loader }}
          github-token: ''

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.mrpack
            dist/*.zip
          body_path: dist/modlist.md
          generate_release_notes: true
          fail_on_unmatched_files: true
